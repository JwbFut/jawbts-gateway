name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never let two pushes race on the production deployment.
concurrency:
  group: production
  cancel-in-progress: false

jobs:
  checks-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Vercel builds the uploaded source with the project's Production env.
      # BUILD_HASH keeps the terminal banner tied to the commit; the Vite
      # config reads it in vite.config.ts.
      - name: Deploy to Vercel
        run: npx --yes vercel@65.1.0 deploy --prod --yes --build-env BUILD_HASH="$GITHUB_SHA" --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
